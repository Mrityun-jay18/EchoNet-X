[env:esp32s3dev]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    jgromes/RadioLib@^7.0.0
    mikalhart/TinyGPSPlus@^1.0.3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    jgromes/RadioLib@^7.0.0
    mikalhart/TinyGPSPlus@^1.0.3
